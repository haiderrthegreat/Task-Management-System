services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testflow123
      POSTGRES_DB: testflow
    ports:
      - "5433:5432"
    volumes:
      - testflow_postgres_data:/var/lib/postgresql/data

volumes:
  testflow_postgres_data: